<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<style>
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#111827;
    color:white;
}

h1{
    text-align:center;
    padding:20px;
}

table{
    width:95%;
    margin:auto;
    border-collapse:collapse;
    background:white;
    color:black;
}

th,td{
    border:1px solid #ccc;
    padding:12px;
    text-align:center;
}

th{
    background:#00a651;
    color:white;
}

select{
    padding:8px;
}

button{
    padding:8px 15px;
    background:#00a651;
    color:white;
    border:none;
    cursor:pointer;
    border-radius:5px;
}

button:hover{
    background:#00813f;
}
</style>

</head>

<body>

<h1>Admin Dashboard</h1>

<table>

<thead>

<tr>
<th>Order ID</th>
<th>Username</th>
<th>Pack</th>
<th>Price</th>
<th>Payment</th>
<th>Status</th>
<th>Save</th>
</tr>

</thead>

<tbody id="ordersTable">

</tbody>

</table>
<script type="module">
import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    doc,
    updateDoc
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAQyV8ACphNSYGQWflbTYYJZAJOtfy3DUs",
  authDomain: "robux-shop-main.firebaseapp.com",
  projectId: "robux-shop-main",
  storageBucket: "robux-shop-main.firebasestorage.app",
  messagingSenderId: "431281623609",
  appId: "1:431281623609:web:9659ae9ef6daf6bb3c33e8",
  measurementId: "G-DG8P1VJJC7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const table = document.getElementById("ordersTable");

async function loadOrders(){

    table.innerHTML = "";

    const querySnapshot = await getDocs(collection(db,"orders"));

    querySnapshot.forEach((doc)=>{

        const order = doc.data();

        table.innerHTML += `
        <tr>
            <td>${order.orderId}</td>
            <td>${order.username}</td>

            <td>${order.pack}</td>

            <td>${order.price}</td>

            <td>${order.payment}</td>

            <td>

                <select id="${doc.id}">

                    <option ${order.status=="Pending"?"selected":""}>Pending</option>

                    <option ${order.status=="Paid"?"selected":""}>Paid</option>

                    <option ${order.status=="Delivered"?"selected":""}>Delivered</option>

                </select>

            </td>

            <td>

                <button onclick="saveStatus('${doc.id}')">
                    Save
                </button>

            </td>

        </tr>
        `;

    });

}
onAuthStateChanged(auth,(user)=>{

    if(!user){

        alert("Please login first.");

        window.location.href="login.html";

        return;

    }

    if(user.email!="suham2012dasking@gmail.com"){

        alert("Access Denied");

        window.location.href="robloxmain.html";

        return;

    }
    loadOrders();

});

window.saveStatus = async function(id){

    const status = document.getElementById(id).value;

    await updateDoc(doc(db,"orders",id),{

        status: status

    });

    alert("Status Updated!");

}
</script>
</body>
</html>
